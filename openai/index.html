<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grayhaven Systems LLC OpenAI Business Profile Preview</title>
    <link rel="stylesheet" href="../web/style-guide/fonts.css?v=20260830">
    <link
      rel="stylesheet"
      href="../web/style-guide/fontawesome.min.css?v=20260830"
   >
    <link rel="stylesheet" href="../web/shared-components.css?v=20260915a">
    <link rel="stylesheet" href="preview.css?v=20261111">
  </head>
  <body>
    <header class="openai-preview-header">
      <nav
        class="openai-preview-header-inner"
        aria-label="OpenAI business profile preview navigation"
      >
        <a
          class="openai-preview-brand"
          href="./index.html"
          aria-label="Grayhaven Systems LLC OpenAI business profile preview home"
        >
          <img
            src="../logo/svg/grayhaven-logo-wordmark-dark.svg"
            alt="Grayhaven Systems LLC"
         >
        </a>
        <a
          class="button button-secondary openai-preview-source"
          href="../docs/openai.md"
          aria-label="Back to OpenAI"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Back to OpenAI</span>
        </a>
      </nav>
    </header>
    <main class="openai-preview-main">
      <header class="openai-preview-intro">
        <p class="eyebrow">OPENAI BUSINESS PROFILE PREVIEW</p>
        <h1>Grayhaven Systems LLC OpenAI business profile</h1>
        <p class="muted">
          Approved monogram logo and cover image for the company business profile.
        </p>
      </header>
      <div class="openai-preview-grid">
        <section
          class="openai-preview-card openai-preview-card-light"
          aria-labelledby="business-profile-logo-title"
        >
          <h2 id="business-profile-logo-title">Business profile logo</h2>
          <div class="openai-preview-artwork">
            <img
              class="monogram"
              src="../logo/svg/grayhaven-logo-monogram.svg"
              alt="Grayhaven Systems LLC monogram logo"
           >
          </div>
        </section>
        <section
          class="openai-preview-card"
          aria-labelledby="business-profile-cover-title"
        >
          <h2 id="business-profile-cover-title">Business profile cover</h2>
          <div class="openai-preview-artwork">
            <img
              class="cover"
              src="../assets/openai-business-profile-cover.png"
              alt="Grayhaven Systems LLC OpenAI business profile cover"
              width="1200"
              height="400"
           >
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
